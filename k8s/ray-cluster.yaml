apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: riftbound-rl-cluster
  namespace: ray-system
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8265"
spec:
  rayVersion: '2.9.0'
  headGroupSpec:
    replicas: 1
    rayStartParams:
      dashboard-host: '0.0.0.0'
    template:
      spec:
        containers:
        - name: ray-head
          image: manu/riftbound-ray-head:v1.0.0
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "2"
              memory: "16Gi" # Increased for policy optimization (AlphaStar pattern)
            requests:
              cpu: "1"
              memory: "8Gi"
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
  workerGroupSpecs:
  - replicas: 4 # Increased to 4 actors for better entropy
    minReplicas: 2
    maxReplicas: 10
    groupName: cpu-group
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: manu/riftbound-ray-worker:v1.0.0
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","ray stop"]
          resources:
            limits:
              cpu: "1"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "2Gi"
          volumeMounts:
          - mountPath: /dev/shm
            name: dshm
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
